<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lịch tàu cảng Hải Phòng</title>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <header>
    <h1>Lịch tàu cảng Hải Phòng</h1>
    <div id="freshness" class="badge">đang tải…</div>
  </header>

  <nav class="tabs">
    <button data-tab="lookup">Tra cứu</button>
    <button data-tab="analysis" class="active">Phân tích</button>
    <button data-tab="quality">Chất lượng dữ liệu</button>
    <button data-tab="hcm">TP.HCM</button>
    <button data-tab="map">Bản đồ</button>
  </nav>

  <main>
    <section id="tab-lookup" hidden></section>
    <section id="tab-analysis"></section>
    <section id="tab-quality" hidden></section>
    <section id="tab-hcm" hidden></section>
    <section id="tab-map" hidden></section>
  </main>

  <script type="module">
    import { initLookup } from "./js/lookup.js";
    import { initFreshness } from "./js/quality.js";
    initFreshness(document.getElementById("freshness"));

    const loaded = new Set();
    async function show(name) {
      document.querySelectorAll("nav.tabs button").forEach((b) =>
        b.classList.toggle("active", b.dataset.tab === name));
      for (const key of ["lookup", "analysis", "quality", "hcm", "map"]) {
        document.getElementById(`tab-${key}`).hidden = key !== name;
      }
      if (loaded.has(name)) return;
      loaded.add(name);
      const root = document.getElementById(`tab-${name}`);
      if (name === "lookup") initLookup(root);
      if (name === "analysis") (await import("./js/analysis.js")).initAnalysis(root);
      if (name === "quality") (await import("./js/quality.js")).initQuality(root);
      if (name === "hcm") (await import("./js/hcm.js")).initHcm(root);
      if (name === "map") (await import("./js/map.js")).initMap(root);
    }

    document.querySelectorAll("nav.tabs button").forEach((b) =>
      b.addEventListener("click", () => show(b.dataset.tab)));
    show("analysis");
  </script>
</body>
</html>
