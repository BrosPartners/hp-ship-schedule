<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard ngành cảng biển</title>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <header>
    <h1 id="title">Dashboard ngành cảng biển</h1>
    <div id="freshness" class="badge">đang tải…</div>
  </header>

  <nav class="tabs ports">
    <button data-port="hp" class="active">Hải Phòng</button>
    <button data-port="hcm">TP.HCM</button>
    <button data-port="trade">Xuất nhập khẩu VN</button>
  </nav>

  <nav class="tabs subtabs" id="subtabs-hp">
    <button data-tab="lookup">Tra cứu</button>
    <button data-tab="analysis" class="active">Phân tích</button>
    <button data-tab="map">Bản đồ</button>
    <button data-tab="route">Tuyến</button>
  </nav>

  <nav class="tabs subtabs" id="subtabs-hcm" hidden>
    <button data-tab="hcm-lookup">Tra cứu</button>
    <button data-tab="hcm">Phân tích</button>
    <button data-tab="hcm-map">Bản đồ</button>
    <button data-tab="hcm-route">Tuyến</button>
  </nav>

  <main>
    <section id="tab-lookup" hidden></section>
    <section id="tab-analysis"></section>
    <section id="tab-map" hidden></section>
    <section id="tab-route" hidden></section>
    <section id="tab-hcm-lookup" hidden></section>
    <section id="tab-hcm" hidden></section>
    <section id="tab-hcm-map" hidden></section>
    <section id="tab-hcm-route" hidden></section>
    <section id="tab-trade" hidden></section>
  </main>

  <script type="module">
    import { initLookup } from "./js/lookup.js";
    import { initFreshness } from "./js/quality.js";
    initFreshness(document.getElementById("freshness"));

    // Hai cảng là hai dataset riêng, nên chúng là hai tab cấp một, mỗi cảng có
    // thanh tab con riêng. Tab con của hai cảng không dùng chung id vì chúng
    // đọc hai bộ Parquet khác schema.
    // Tiêu đề trang giữ nguyên "Dashboard ngành cảng biển" ở mọi tab: nội
    // dung đã vượt xa một cảng (hai cảng + xuất nhập khẩu + tuyến), và tab
    // đang chọn đã cho biết đang xem gì nên không cần đổi tiêu đề theo cảng.
    const PORTS = {
      hp: { tabs: ["lookup", "analysis", "map", "route"], initial: "analysis" },
      hcm: { tabs: ["hcm-lookup", "hcm", "hcm-map", "hcm-route"],
             initial: "hcm" },
      // Không phải dữ liệu cảng nên không có thanh tab con - một trang duy
      // nhất, giống cách tab TP.HCM ban đầu trước khi có Bản đồ/Tra cứu.
      trade: { tabs: ["trade"], initial: "trade" },
    };
    const ALL_TABS = Object.values(PORTS).flatMap((p) => p.tabs);
    const loaded = new Set();
    let currentPort = "hp";

    async function showTab(name) {
      document.querySelectorAll("nav.subtabs button").forEach((b) =>
        b.classList.toggle("active", b.dataset.tab === name));
      for (const key of ALL_TABS) {
        document.getElementById(`tab-${key}`).hidden = key !== name;
      }
      if (loaded.has(name)) return;
      loaded.add(name);
      const root = document.getElementById(`tab-${name}`);
      if (name === "lookup") initLookup(root);
      if (name === "analysis") (await import("./js/analysis.js")).initAnalysis(root);
      if (name === "map") (await import("./js/map.js")).initMap(root, "hp");
      if (name === "route") (await import("./js/route.js")).initRoute(root);
      // TP.HCM không có tab tuyến thật: nguồn cảng vụ TP.HCM không công bố
      // cảng đi/cảng đến (xem ghi chú trong module). Thay vào đó hiện một
      // chart tỷ trọng cờ tàu, kèm cảnh báo rõ đây không phải tuyến.
      if (name === "hcm-route")
        (await import("./js/hcm-route.js")).initHcmRoute(root);
      if (name === "hcm-map")
        (await import("./js/map.js")).initMap(root, "hcm");
      if (name === "hcm") (await import("./js/hcm.js")).initHcm(root);
      if (name === "hcm-lookup")
        (await import("./js/hcm-lookup.js")).initHcmLookup(root);
      if (name === "trade") (await import("./js/trade.js")).initTrade(root);
    }

    function showPort(port) {
      currentPort = port;
      document.querySelectorAll("nav.ports button").forEach((b) =>
        b.classList.toggle("active", b.dataset.port === port));
      document.getElementById("subtabs-hp").hidden = port !== "hp";
      document.getElementById("subtabs-hcm").hidden = port !== "hcm";
      document.getElementById("freshness").hidden = port === "trade";
      showTab(PORTS[port].initial);
    }

    document.querySelectorAll("nav.ports button").forEach((b) =>
      b.addEventListener("click", () => showPort(b.dataset.port)));
    document.querySelectorAll("nav.subtabs button").forEach((b) =>
      b.addEventListener("click", () => showTab(b.dataset.tab)));
    showPort("hp");
  </script>
</body>
</html>
