name: daily-crawl

on:
  schedule:
    - cron: "30 0 * * *"   # 07:30 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# A manual workflow_dispatch overlapping the cron schedule, or any other
# concurrent commit landing on master, must not race this job's `git push`.
# Queue overlapping runs rather than cancel one: cancelling a live crawl
# mid-write could leave a partial data commit.
concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Run offline test suite
        run: python -m pytest -q -k "not real_data_coverage"

      - name: Crawl and rebuild (Hai Phong)
        id: crawl_hp
        run: python -m scraper.daily

      - name: Crawl and rebuild (HCM City)
        id: crawl_hcm
        if: always()
        run: python -m scraper.hcm.daily

      # VPA volume changes monthly, but its denominator (calls, DWT) changes
      # daily, so teu.json has to be rebuilt after each crawl or it drifts out
      # of step with every other chart.
      - name: Rebuild VPA container volume
        if: always()
        run: python -m scraper.vpa.build

      # Tuyến quốc tế chỉ có ở Hải Phòng (nguồn TP.HCM không công bố cảng
      # đi/đến), và đọc thẳng Parquet nên không phụ thuộc bước VPA/bản đồ.
      - name: Rebuild route flows (Hai Phong)
        if: always()
        run: python -m scraper.route_flows

      # Depends on both teu.json and berth_share.json, so it runs last.
      - name: Rebuild map points
        if: always()
        run: |
          python -m scraper.map_data
          python -m scraper.map_data --dataset hcm

      # Nguồn XNK giờ là Excel gốc (data/trade/xls/, owner tải tay và thả vào
      # - giống data/vpa) thay vì tự động tải PDF hải quan như trước; chỉ cần
      # build lại mỗi ngày để JSON không lệch nếu file vừa được thay.
      - name: Rebuild VN trade tab from Excel
        if: always()
        run: python -m scraper.trade.build_xls

      - name: Fail the run if either crawl failed
        if: always()
        run: |
          if [ "${{ steps.crawl_hp.outcome }}" != "success" ] || [ "${{ steps.crawl_hcm.outcome }}" != "success" ]; then
            echo "Hai Phong: ${{ steps.crawl_hp.outcome }}, HCM: ${{ steps.crawl_hcm.outcome }}" >&2
            exit 1
          fi

      - name: Commit data changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: daily crawl $(date -u +%Y-%m-%d)"
            # The concurrency group above should make this rare, but guard
            # against a racing commit anyway (e.g. a manual dispatch run
            # that started just before this one, or any other push to
            # master): rebase onto the latest master and retry a few times
            # rather than fail on a bare push. A real crawl failure (script
            # error, parse failure, etc.) happens well before this step and
            # is unaffected - this only guards the push-collision case.
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "push failed after 5 attempts" >&2
                exit 1
              fi
              echo "push rejected (attempt $attempt), rebasing onto latest master and retrying"
              git fetch origin master
              git rebase origin/master
            done
          fi

      - name: Open an issue if the crawl failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily crawl failed ${new Date().toISOString().slice(0,10)}`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

# Cron: 00:30 UTC = 07:30 gio Viet Nam (UTC+7).
