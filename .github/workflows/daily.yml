name: daily-crawl

on:
  schedule:
    - cron: "30 0 * * *"   # 07:30 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Run offline test suite
        run: python -m pytest -q -k "not real_data_coverage"

      - name: Crawl and rebuild
        run: python -m scraper.daily

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: daily crawl $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open an issue if the crawl failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily crawl failed ${new Date().toISOString().slice(0,10)}`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

# Cron: 00:30 UTC = 07:30 gio Viet Nam (UTC+7).
